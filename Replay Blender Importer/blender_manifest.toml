schema_version = "1.0.0"

id = "acreplay_importer"
version = "0.2.1"
name = "AC Replay Importer"
tagline = "Animate your cars using Assetto Corsa replays"
maintainer = "Abhyudaya Chouhan"
type = "add-on"

# Link to documentation, support, source files, etc
website = "https://github.com/abchouhan/acreplay-parser"

# Tag list defined by Blender and server, see:
# https://docs.blender.org/manual/en/dev/advanced/extensions/tags.html
tags = ["Animation"]

blender_version_min = "4.2.0"
# Blender version that the extension does not support, earlier versions are supported.
# blender_version_max = "4.4.0"

# License conforming to https://spdx.org/licenses/ (use "SPDX: prefix)
# https://docs.blender.org/manual/en/dev/advanced/extensions/licenses.html
license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
files = "Import JSON from disk"
